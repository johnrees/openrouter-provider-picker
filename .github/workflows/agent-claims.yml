name: agent-claims
# Removes the claimed label when a claim's pull request closes or merges
# (agent-gh's README, "Claims").
on:
  pull_request_target:
    types: [closed]
permissions: {}
jobs:
  agent-claims:
    uses: johnrees/agent-gh/.github/workflows/agent-claims.yml@v0.14.1
    with:
      version: v0.14.1
    # contents (the label's name), pull-requests (the open pull requests),
    # issues (the issues, comments, and the label).
    permissions:
      contents: read
      issues: write
      pull-requests: read
