name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so `bun fmt --check` can't drift with formatter releases.
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun check
      - run: bun fmt --check
